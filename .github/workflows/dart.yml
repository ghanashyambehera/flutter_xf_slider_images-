# Flutter CI for flutter_xf_slider_images.
# This is a Flutter package (not a pure Dart package), so the job uses
# Flutter SDK rather than dart-lang/setup-dart.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze-and-test:
    name: Format, analyze, and test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install package dependencies
        run: flutter pub get

      - name: Install example dependencies
        working-directory: example
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze package
        run: flutter analyze --fatal-infos

      - name: Analyze example
        working-directory: example
        run: flutter analyze --fatal-infos

      - name: Test package
        run: flutter test --coverage

      - name: Test example
        working-directory: example
        run: flutter test

      - name: Publish dry-run
        run: dart pub publish --dry-run

  # Optional: verify the example app can still compile for web (no device needed).
  example-web:
    name: Example web build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: analyze-and-test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install example dependencies
        working-directory: example
        run: flutter pub get

      - name: Build example (web)
        working-directory: example
        run: flutter build web --release
